<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividWalls - Information Center</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #16161e;
            --accent-color: #00ffa3;
            --text-color: #f0f0f5;
            --muted-text: #a0a0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #222230;
        }

        a.back-btn {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        a.back-btn:hover {
            text-decoration: underline;
        }

        h1 {
            color: var(--text-color);
            border-bottom: 2px solid #222230;
            padding-bottom: 10px;
            margin-top: 0;
        }

        h3 {
            color: var(--accent-color);
            margin-top: 25px;
        }

        p, li {
            color: var(--muted-text);
        }

        ul {
            padding-left: 20px;
        }

        /* Simple Contact Form Style */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .contact-form input, .contact-form textarea {
            background: #0f0f12;
            border: 1px solid #333;
            padding: 12px;
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
        }

        .contact-form button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .contact-form button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">&larr; Back to Wallpapers</a>
        <div id="content-area">
            </div>
    </div>

    <script src="info.js"></script>
</body>
</html>
